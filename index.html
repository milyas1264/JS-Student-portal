<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Portal</title>
  <style>
    body {
      background-color: #6d7881;
    }
    h2 {
      padding: 10px;
      margin-bottom: 20px;
      background-color: cadetblue;
      border: 4px ridge gold;
      color: yellow;
    }
      input {
        margin: 5px;
        padding: 10px;
        border: 2px outset gold;
        border-radius: 5px;
      }
      button{
         display: inline-block;
  width: 200px;
  margin: 10px;
  margin-left: 0;
  padding: 10px 15px;
  background-color: #37eeb1;
  color: navy;
  text-decoration: none;
  text-align: center;
  border-radius: 5px;
  border-bottom: #336088 5px solid;
      }
  </style>
</head>
<body style="font-family: sans-serif; text-align: center; margin: 30px;">

  <h2>Student Portal</h2>

  <!-- Student Form -->
  <input type="text" id="name" placeholder="Enter Name" />
  <input type="text" id="roll" placeholder="Enter Roll No" />
  <input type="number" id="marks" placeholder="Enter Marks" />
  <button onclick="addStudent()">Add Student</button>
  <button onclick="deleteStudent()">Delete Student</button>
 

  <hr >

  <!-- Student Cards Area -->
  <div id="studentContainer" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;"></div>

  <script src="script.js"></script>
</body>
</html>
